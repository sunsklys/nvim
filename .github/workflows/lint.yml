name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # 最小化：lint 只需读代码，防 token 默认权限被劫持 action 滥用

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7：SHA pin 防 tag 被重指（tag 可 force-push 指向新 commit）
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5：同上
        with:
          version: 2.5.2 # 钉住：latest 曾因 2.5.2 格式变更致 CI 红（单行 if 展开等）；升级需本地同步重跑 stylua
          token: ${{ github.token }} # action v4+ 必传：无 token 时下载 release 报 opts.auth is required
          args: --check . # 递归全仓（含根目录 init.lua；stylua 只碰 .lua）
